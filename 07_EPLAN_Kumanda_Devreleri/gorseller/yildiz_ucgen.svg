<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Consolas, monospace" font-size="12">
  <rect width="720" height="440" fill="#fff"/>
  <text x="360" y="24" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" font-weight="bold" fill="#223">Yıldız-Üçgen Yol Verme: Kumanda Devresi (24 VAC)</text>
  <g stroke="#111" stroke-width="1.6" fill="none">
    <!-- baralar -->
    <line x1="40" y1="50" x2="680" y2="50"/><line x1="40" y1="400" x2="680" y2="400"/>
    <!-- ortak zincir: F2 termik, S0 stop -->
    <line x1="80" y1="50" x2="80" y2="80"/>
    <path d="M80,80 L80,90 L92,104 M80,110 L80,120"/><path d="M70,95 L86,95" stroke-dasharray="3,2"/>
    <line x1="80" y1="120" x2="80" y2="140"/>
    <path d="M80,140 L80,150 L92,164 M80,170 L80,180"/><line x1="62" y1="157" x2="86" y2="157"/>
    <line x1="80" y1="180" x2="80" y2="200"/>
    <line x1="80" y1="200" x2="600" y2="200"/>
    <!-- S1 start (NO) + K1 mühürleme -->
    <line x1="160" y1="200" x2="160" y2="220"/><path d="M160,220 L172,236 M160,240 L160,256"/><line x1="140" y1="228" x2="166" y2="228"/>
    <line x1="160" y1="256" x2="160" y2="330"/>
    <line x1="240" y1="200" x2="240" y2="220"/>
    <line x1="240" y1="220" x2="240" y2="220"/><path d="M240,220 L252,236 M240,240 L240,256"/>
    <line x1="240" y1="256" x2="240" y2="270"/><line x1="160" y1="270" x2="240" y2="270"/>
    <!-- K1 bobin -->
    <rect x="145" y="330" width="30" height="40"/><line x1="160" y1="370" x2="160" y2="400"/>
    <!-- KT1 bobin: K1 sonrası -->
    <line x1="240" y1="270" x2="330" y2="270"/><line x1="330" y1="270" x2="330" y2="330"/>
    <rect x="315" y="330" width="30" height="40"/><path d="M315,330 L345,370"/><line x1="330" y1="370" x2="330" y2="400"/>
    <!-- K3 yıldız: KT1 NC (gecikmeli açılan) + K2 NC -->
    <line x1="330" y1="270" x2="440" y2="270"/>
    <line x1="440" y1="270" x2="440" y2="280"/><path d="M440,280 L452,294 M434,290 L452,290 M440,296 L440,304"/>
    <line x1="440" y1="304" x2="440" y2="312"/><path d="M440,312 L452,322 M436,318 L452,318 M440,326 L440,330"/>
    <rect x="425" y="330" width="30" height="40"/><line x1="440" y1="370" x2="440" y2="400"/>
    <!-- K2 üçgen: KT1 NO (gecikmeli kapanan) + K3 NC -->
    <line x1="440" y1="270" x2="560" y2="270"/>
    <line x1="560" y1="270" x2="560" y2="280"/><path d="M560,280 L572,294 M560,296 L560,304"/>
    <line x1="560" y1="304" x2="560" y2="312"/><path d="M560,312 L572,322 M556,318 L572,318 M560,326 L560,330"/>
    <rect x="545" y="330" width="30" height="40"/><line x1="560" y1="370" x2="560" y2="400"/>
  </g>
  <g fill="#111">
    <text x="98" y="100">F2 (termik)</text><text x="98" y="160">S0 stop</text>
    <text x="104" y="246">S1</text><text x="256" y="246">K1</text><text x="200" y="196" font-size="10">mühürleme</text>
    <text x="140" y="355" text-anchor="end" font-weight="bold">K1</text><text x="182" y="355" font-size="10">ana</text>
    <text x="310" y="355" text-anchor="end" font-weight="bold">KT1</text><text x="352" y="355" font-size="10">zaman</text>
    <text x="458" y="292" font-size="10">KT1 (NC)</text><text x="458" y="322" font-size="10">K2 (NC)</text>
    <text x="420" y="355" text-anchor="end" font-weight="bold">K3</text><text x="462" y="355" font-size="10">yıldız</text>
    <text x="578" y="292" font-size="10">KT1 (NO)</text><text x="578" y="322" font-size="10">K3 (NC)</text>
    <text x="540" y="355" text-anchor="end" font-weight="bold">K2</text><text x="582" y="355" font-size="10">üçgen</text>
    <text x="44" y="44">L (24 VAC)</text><text x="44" y="418">N</text>
  </g>
  <text x="680" y="430" text-anchor="end" font-family="Segoe UI, Arial" font-size="11" fill="#c4302b">K2 ↔ K3 elektriksel kilitleme</text>
</svg>
